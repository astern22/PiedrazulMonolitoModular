services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

  db:
    image: postgres:16
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=piedrazuldb
      - POSTGRES_USER=piedrazul_admin
      - POSTGRES_PASSWORD=Piedrazul123.
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "piedrazul_admin", "-d", "piedrazuldb" ]
      interval: 10s
      timeout: 5s
      retries: 5
    
volumes:
  db-data: